<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Programas — Niterra</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="../js/darkmode.js"></script>
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <img src="../images/logo.png" alt="Niterra Logo" class="sidebar-logo">
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Menu Principal</div>
        <a href="controleProgramas.html" class="nav-item active">
          <i class="ph ph-squares-four"></i>
          <span>Programas</span>
        </a>
        <a href="usuarios.html" class="nav-item">
          <i class="ph ph-users"></i>
          <span>Usuários</span>
        </a>

        <div class="nav-section-title" style="margin-top: 1.5rem;">Preferências</div>
        <button type="button" class="nav-item theme-toggle-btn" style="background:none; border:none; width:100%; text-align:left; cursor:pointer;">
          <i class="ph ph-moon theme-icon"></i>
          <span class="theme-label">Modo Escuro</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-badge">
          <div class="user-avatar">A</div>
          <div class="user-info">
            <div class="user-name">Carregando...</div>
            <div class="user-role">Analista</div>
          </div>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" onclick="logoutUser()" style="width: 100%;">
          <i class="ph ph-sign-out"></i> Sair
        </button>
      </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button type="button" class="mobile-menu-btn">
            <i class="ph ph-list"></i>
          </button>
          <h1 class="topbar-title">Programas & Versões</h1>
        </div>

        <div class="topbar-right">
          <button type="button" class="btn btn-primary" onclick="openModal('modalAddPrograma')">
            <i class="ph ph-plus-circle"></i>
            Cadastrar Programa
          </button>
        </div>
      </header>

      <div class="app-content">
        <!-- Cards de Métricas -->
        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-icon-wrap metric-slate">
              <i class="ph ph-code"></i>
            </div>
            <div class="metric-data">
              <div class="metric-value" id="metricTotal">0</div>
              <div class="metric-label">Total de Programas</div>
            </div>
          </div>

          <div class="metric-card">
            <div class="metric-icon-wrap metric-warning">
              <i class="ph ph-wrench"></i>
            </div>
            <div class="metric-data">
              <div class="metric-value" id="metricDev">0</div>
              <div class="metric-label">Em Desenvolvimento</div>
            </div>
          </div>

          <div class="metric-card">
            <div class="metric-icon-wrap metric-green">
              <i class="ph ph-check-circle"></i>
            </div>
            <div class="metric-data">
              <div class="metric-value" id="metricDisponivel">0</div>
              <div class="metric-label">Disponíveis</div>
            </div>
          </div>

          <div class="metric-card">
            <div class="metric-icon-wrap metric-info">
              <i class="ph ph-users-three"></i>
            </div>
            <div class="metric-data">
              <div class="metric-value" id="metricDevsCount">0</div>
              <div class="metric-label">Desenvolvedores Ativos</div>
            </div>
          </div>
        </div>

        <!-- Barra de Ações e Filtros -->
        <div class="dashboard-actions-bar">
          <div class="search-filter-wrap">
            <div class="search-box">
              <i class="ph ph-magnifying-glass"></i>
              <input type="text" id="inputSearchPrograma" placeholder="Buscar por nome ou descrição...">
            </div>

            <select id="selectStatusFilter" class="select-filter">
              <option value="TODOS">Todos os Status</option>
              <option value="DISPONIVEL">Disponíveis</option>
              <option value="EM_DESENVOLVIMENTO">Em Desenvolvimento</option>
            </select>

            <select id="selectDevFilter" class="select-filter">
              <option value="TODOS">Todos Desenvolvedores</option>
            </select>
          </div>
        </div>

        <!-- Tabela de Programas -->
        <div class="table-responsive">
          <table class="custom-table" id="tableProgramas">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome do Programa</th>
                <th>Descrição</th>
                <th>Status</th>
                <th>Desenvolvedor</th>
                <th>Data de Envio</th>
                <th style="text-align: right;">Ações</th>
              </tr>
            </thead>
            <tbody id="tbodyProgramas">
              <!-- Renderizado via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal: Cadastrar Programa -->
  <div class="modal-backdrop" id="modalAddPrograma">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title">Cadastrar Novo Programa</h3>
        <button type="button" class="modal-close-btn">&times;</button>
      </div>
      <form id="formAddPrograma">
        <div class="modal-body">
          <div class="form-group">
            <label for="addNomePrograma">Nome do Programa</label>
            <div class="input-wrap">
              <i class="ph ph-cube input-icon"></i>
              <input type="text" id="addNomePrograma" placeholder="Ex: ControleEstoque_v2.0" required>
            </div>
          </div>

          <div class="form-group">
            <label for="addDescricaoPrograma">Descrição do Programa</label>
            <textarea id="addDescricaoPrograma" rows="3" style="width:100%; padding:0.75rem 1rem; border:1.5px solid var(--border); border-radius:var(--input-radius); background:var(--white); color:var(--text); outline:none;" placeholder="Descreva a finalidade ou alteração deste programa..."></textarea>
          </div>

          <div class="form-group">
            <label for="addStatusPrograma">Status Atual</label>
            <select id="addStatusPrograma" class="select-filter" style="width:100%;">
              <option value="EM_DESENVOLVIMENTO">EM DESENVOLVIMENTO (Com o desenvolvedor)</option>
              <option value="DISPONIVEL">DISPONÍVEL (Pronto / Liberado)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="addUsuarioPrograma">Desenvolvedor Responsável</label>
            <select id="addUsuarioPrograma" class="select-filter" style="width:100%;" required>
              <!-- Carregado via JS -->
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-close-modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">
            <i class="ph ph-check"></i> Salvar Programa
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Editar Programa -->
  <div class="modal-backdrop" id="modalEditPrograma">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title">Editar Programa</h3>
        <button type="button" class="modal-close-btn">&times;</button>
      </div>
      <form id="formEditPrograma">
        <input type="hidden" id="editIdPrograma">
        <div class="modal-body">
          <div class="form-group">
            <label for="editNomePrograma">Nome do Programa</label>
            <div class="input-wrap">
              <i class="ph ph-cube input-icon"></i>
              <input type="text" id="editNomePrograma" required>
            </div>
          </div>

          <div class="form-group">
            <label for="editDescricaoPrograma">Descrição</label>
            <textarea id="editDescricaoPrograma" rows="3" style="width:100%; padding:0.75rem 1rem; border:1.5px solid var(--border); border-radius:var(--input-radius); background:var(--white); color:var(--text); outline:none;"></textarea>
          </div>

          <div class="form-group">
            <label for="editStatusPrograma">Status</label>
            <select id="editStatusPrograma" class="select-filter" style="width:100%;">
              <option value="EM_DESENVOLVIMENTO">EM DESENVOLVIMENTO</option>
              <option value="DISPONIVEL">DISPONÍVEL</option>
            </select>
          </div>

          <div class="form-group">
            <label for="editUsuarioPrograma">Desenvolvedor Responsável</label>
            <select id="editUsuarioPrograma" class="select-filter" style="width:100%;" required>
              <!-- Carregado via JS -->
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-close-modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">
            <i class="ph ph-floppy-disk"></i> Atualizar Programa
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/script.js"></script>
  <script src="../js/programas.js"></script>
</body>
</html>
