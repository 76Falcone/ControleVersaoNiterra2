<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Gerenciamento de Versões Niterra</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-card">
      <img src="../images/logo.png" alt="Niterra Logo" class="login-logo">
      
      <h1 class="login-title">Gerenciamento de versões</h1>
      <p class="login-subtitle">Informe seu usuário e senha para entrar no sistema</p>

      <form id="loginForm" novalidate>
        <div class="form-group" id="groupLogin">
          <label for="inputLogin">Usuário / Registro</label>
          <div class="input-wrap">
            <i class="ph ph-user input-icon"></i>
            <input type="text" id="inputLogin" placeholder="Digite seu usuário ou registro" required autocomplete="username">
          </div>
          <span class="form-error-msg" id="errorLogin">Por favor, informe seu usuário.</span>
        </div>

        <div class="form-group" id="groupSenha">
          <label for="inputSenha">Senha</label>
          <div class="input-wrap">
            <i class="ph ph-lock-key input-icon"></i>
            <input type="password" id="inputSenha" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Mostrar senha">
              <i class="ph ph-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
          <span class="form-error-msg" id="errorSenha">Por favor, informe sua senha.</span>
        </div>

        <button type="submit" class="btn btn-primary btn-login-submit" id="btnLoginSubmit">
          <i class="ph ph-sign-in"></i>
          Entrar no Sistema
        </button>
      </form>

      <div class="login-footer-info">
        <p>© 2026 Niterra. Todos os direitos reservados.</p>
      </div>
    </div>
  </div>

  <script src="../js/script.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
